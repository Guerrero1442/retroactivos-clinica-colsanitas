[project]
name = "retroactivos-clinica-colsanitas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "oracledb>=3.4.1",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.45",
    "unidecode>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",    # Para que pueda encontrar la carpeta 'config'
    "src"   # Para que pueda encontrar lo que hay dentro de 'src' (processing, etc.)
]
testpaths = ["tests"]
